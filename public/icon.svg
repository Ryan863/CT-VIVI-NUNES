<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0A0C0F" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#EA580C" flood-opacity="0.35" />
    </feDropShadow>
    <filter id="dotGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#10B981" flood-opacity="0.8" />
    </feDropShadow>
  </defs>

  <!-- Fundo Squircle com borda dourada sutil -->
  <rect x="16" y="16" width="480" height="480" rx="128" fill="url(#bgGrad)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="8" />

  <!-- Arco Superior Solar / Bola de Vôlei de Areia -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="12" stroke-dasharray="14 10" opacity="0.4" />
  
  <!-- Curva de Areia / Energia Solar -->
  <path d="M 120 330 Q 256 380 392 330" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-linecap="round" opacity="0.6" />

  <!-- Tipografia Monograma Principal: "CT" -->
  <g font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="900" text-anchor="middle">
    <!-- Sombra elegante de profundidade -->
    <text x="256" y="278" font-size="200" fill="#000000" opacity="0.5" letter-spacing="-6">CT</text>
    <!-- Texto Branco Principal -->
    <text x="256" y="272" font-size="200" fill="#FFFFFF" letter-spacing="-6" filter="url(#glow)">CT</text>
  </g>

  <!-- Assinatura "VIVI NUNES" compacta e legível -->
  <g font-family="'Plus Jakarta Sans', 'Arial Black', sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="340" font-size="44" fill="url(#goldGrad)" letter-spacing="6">VIVI NUNES</text>
  </g>

  <!-- Ponto Esmeralda Oficial de Status / Conexão (marca registrada da logo) -->
  <circle cx="395" cy="180" r="22" fill="#10B981" filter="url(#dotGlow)" />
  <circle cx="395" cy="180" r="12" fill="#6EE7B7" />
</svg>